name: Native project lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-copy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Copy a live project and retain coordinator exclusion
        run: python -m unittest discover -s tests -p test_project_lock.py -v
