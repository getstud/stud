name: Native project lock

on:
  workflow_dispatch:
  push:
    branches: [codex/cadquery-project-workflow]
    paths:
      - .github/workflows/project-lock.yml
      - stud/contracts.py
      - tests/test_project_lock.py

permissions:
  contents: read

jobs:
  windows-copy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Copy a live project and retain coordinator exclusion
        run: python -m unittest discover -s tests -p test_project_lock.py -v
