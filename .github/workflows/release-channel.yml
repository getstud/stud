name: Publish preview update feed

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published preview tag to promote (vX.Y.Z-preview.N)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: preview-update-feed
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote tested preview metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node scripts/release-feed.mjs preview "$RELEASE_TAG"
